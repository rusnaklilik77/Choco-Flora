<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Choco-Flora — меню</title>
    <meta name="description" content="Choco-Flora — десерты, приготовленные с душой" />
    <!-- Без referrer некоторые хостинги картинок (в т.ч. иногда Google Диск)
         могут отказывать в показе изображения по прямой ссылке. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Помогают сайту вести себя как приложение на телефоне и не
         конфликтовать с системной навигацией (полоска-индикатор home у
         iPhone, жесты/кнопки навигации у Android): скрывают браузерный
         хром при установке на главный экран и красят системные полосы. -->
    <meta name="theme-color" content="#2b0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Choco-Flora" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&family=Comfortaa:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Caveat:wght@400;600;700&family=Pacifico&family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
